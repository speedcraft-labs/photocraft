[package]
name = "photocraft-algo"
description = "Depth-agnostic, tile-aware CPU image filters (blur, sharpen, noise, distort, stylize)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-blur = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
serde = { workspace = true }
rustfft = "6.4.1"

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
photocraft-testkit = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
image = { workspace = true, features = ["png"] }
craft-bench = { git = "https://github.com/speedcraft-labs/craft-libs", branch = "algo/integration" }

[[bench]]
name = "blur"
harness = false

[[bench]]
name = "hdr_toning"
harness = false
