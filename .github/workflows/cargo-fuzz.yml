name: Cargo Fuzz

on:
  schedule:
    - cron: "53 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-fuzz-${{ github.ref }}-${{ matrix.crate }}-${{ matrix.target }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: [self-hosted, agentbox]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: affinity
            target: preview
          - crate: affinity
            target: import_preview
            features: io
          - crate: affinity
            target: stream
          - crate: codecs
            target: decode_any
          - crate: codecs
            target: decode_png
          - crate: codecs
            target: decode_jpeg
          - crate: codecs
            target: decode_tiff
          - crate: codecs
            target: decode_exr
          - crate: codecs
            target: decode_heif
          - crate: codecs
            target: decode_gif
          - crate: codecs
            target: decode_webp
          - crate: format
            target: load
          - crate: psd
            target: parse
          - crate: psd
            target: descriptor
          - crate: psd
            target: abr
          - crate: psd
            target: asl
          - crate: psd
            target: image_source_data
          - crate: psd
            target: grd
          - crate: psd
            target: ase
          - crate: psd
            target: aco
          - crate: psd
            target: patterns
          - crate: psd
            target: filter_effects
          - crate: psd
            target: metadata
          - crate: psd
            target: tagged
          - crate: psd
            target: resources
          - crate: psd
            target: atn
          - crate: raw
            target: develop
          - crate: raw
            target: ljpeg
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: /jobs/work/speedcraft-labs/targets/fuzzers-200-photocraft
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: nice -n 19 cargo +nightly install cargo-fuzz --locked
      - name: Set up persistent corpus
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          corpus="/jobs/work/speedcraft-labs/fuzz-corpus/photocraft/${{ matrix.crate }}/${{ matrix.target }}"
          artifacts="$RUNNER_TEMP/fuzz-artifacts/photocraft-${{ matrix.crate }}-${{ matrix.target }}"
          mkdir -p "$corpus" "$artifacts"
          echo "corpus=$corpus" >> "$GITHUB_OUTPUT"
          echo "artifacts=$artifacts" >> "$GITHUB_OUTPUT"
      - name: Fuzz (10 minute target budget)
        id: fuzz
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd "crates/${{ matrix.crate }}"
          extra=()
          if [ -n "${{ matrix.features || '' }}" ]; then extra+=(--features "${{ matrix.features }}"); fi
          nice -n 19 cargo +nightly fuzz run "${{ matrix.target }}" "${{ steps.paths.outputs.corpus }}" "${extra[@]}" -- \
            -max_len=4194304 -max_total_time=600 \
            -artifact_prefix="${{ steps.paths.outputs.artifacts }}/"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Minimize crash reproducers and corpus
        if: always()
        shell: bash
        run: |
          set +e
          cd "crates/${{ matrix.crate }}"
          mkdir -p "${{ steps.paths.outputs.artifacts }}/minimized"
          while IFS= read -r -d '' crash; do
            extra=()
            if [ -n "${{ matrix.features || '' }}" ]; then extra+=(--features "${{ matrix.features }}"); fi
            nice -n 19 cargo +nightly fuzz tmin "${{ matrix.target }}" "$crash" "${extra[@]}" -- -max_total_time=60 -artifact_prefix="${{ steps.paths.outputs.artifacts }}/minimized/"
          done < <(find "${{ steps.paths.outputs.artifacts }}" -type f -name 'crash-*' -print0)
          extra=()
          if [ -n "${{ matrix.features || '' }}" ]; then extra+=(--features "${{ matrix.features }}"); fi
          nice -n 19 cargo +nightly fuzz cmin "${{ matrix.target }}" "${{ steps.paths.outputs.corpus }}" "${extra[@]}" -- -max_total_time=60
      - name: Upload crash reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-photocraft-${{ matrix.crate }}-${{ matrix.target }}
          path: ${{ steps.paths.outputs.artifacts }}
          if-no-files-found: ignore
      - name: Fail when fuzzing found a crash
        if: steps.fuzz.outputs.exit_code != '0'
        run: exit 1
